<svg width="32" height="32" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect width="36" height="36" rx="9" fill="#2563eb"/>

  <!-- Left brain lobe -->
  <path
    d="M18 10 C14 10 10 13 10 17 C10 19.5 11.2 21.5 13 22.5 C12.5 24 13 25.5 14.5 26 C16 26.5 17 25.5 18 24.5"
    stroke="white"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Right brain lobe -->
  <path
    d="M18 10 C22 10 26 13 26 17 C26 19.5 24.8 21.5 23 22.5 C23.5 24 23 25.5 21.5 26 C20 26.5 19 25.5 18 24.5"
    stroke="white"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Center spine -->
  <line x1="18" y1="10" x2="18" y2="24.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Neural nodes -->
  <circle cx="13.5" cy="15.5" r="1.3" fill="white"/>
  <circle cx="22.5" cy="15.5" r="1.3" fill="white"/>
  <circle cx="13"   cy="20"   r="1"   fill="rgba(255,255,255,0.65)"/>
  <circle cx="23"   cy="20"   r="1"   fill="rgba(255,255,255,0.65)"/>
  <circle cx="18"   cy="13"   r="1.1" fill="white"/>

  <!-- Synapse connections -->
  <line x1="13.5" y1="15.5" x2="18"   y2="13"   stroke="rgba(255,255,255,0.45)" stroke-width="0.9"/>
  <line x1="22.5" y1="15.5" x2="18"   y2="13"   stroke="rgba(255,255,255,0.45)" stroke-width="0.9"/>
  <line x1="13.5" y1="15.5" x2="13"   y2="20"   stroke="rgba(255,255,255,0.45)" stroke-width="0.9"/>
  <line x1="22.5" y1="15.5" x2="23"   y2="20"   stroke="rgba(255,255,255,0.45)" stroke-width="0.9"/>
</svg>