services:
  - type: web
    name: hr-resume-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false # Set this in Render dashboard
      - key: REDIS_URL
        fromService:
          type: redis
          name: hr-resume-redis
          property: connectionString

